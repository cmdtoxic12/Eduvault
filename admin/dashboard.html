<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - EduVault</title>
  <link rel="stylesheet" href="admin.css" />
   <link rel="icon" type="image/png" href="https://files.catbox.moe/js6w3n.png">
</head>
<body>

  <header class="admin-header">
     <img src="https://files.catbox.moe/js6w3n.png" alt="EduVault Logo" class="site-logo">
    <h1>EduVault Admin</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main class="admin-main">

    <section class="upload-section">
      <h2>Upload New Resource</h2>

      <form id="uploadForm">
        <input type="text" id="title" placeholder="Resource title" required />

        <textarea id="description" placeholder="Resource description"></textarea>

        <select id="subject" required>
          <option value="">Select Subject</option>
          <option value="ICT">ICT</option>
          <option value="Mathematics">Mathematics</option>
          <option value="English">English</option>
          <option value="French">French</option>
          <option value="Science">Science</option>
          <option value="Social Studies">Social Studies</option>
          <option value="Ghanaian Lang">Ghanaian Lang</option>
        </select>

        <select id="level" required>
          <option value="">Select Level</option>
          <option value="LEVEL 100">LEVEL 100</option>
          <option value="LEVEL 200">LEVEL 200</option>
          <option value="LEVEL 300">LEVEL 300</option>
          <option value="LEVEL 400">LEVEL 400</option>
        </select>

        <select id="category" required>
          <option value="">Select Category</option>
          <option value="Lesson Notes">Lesson Notes</option>
          <option value="Past Questions">Past Questions</option>
          <option value="Assignments">Assignments</option>
          <option value="Slides">Slides</option>
          <option value="Textbooks">Textbooks</option>
        </select>

        <select id="fileType" required>
          <option value="">Select File Type</option>
          <option value="PDF">PDF</option>
          <option value="DOCX">DOCX</option>
          <option value="PPTX">PPTX</option>
          <option value="ZIP">ZIP</option>
          <option value="VIDEO">Video</option>
          <option value="IMAGE">Image</option>
        </select>

        <label class="checkbox-label">
          <input type="checkbox" id="featured" />
          Mark as featured
        </label>

        <input type="file" id="resourceFile" required />

        <button type="submit">Upload Resource</button>
      </form>

      <p id="uploadMessage"></p>
    </section>

    <section class="resource-list-section">
      <h2>Uploaded Resources</h2>

        <button id="refreshAdminBtn" class="refresh-btn">
  Refresh List
</button>
      
      <div id="adminResourceList">
        Loading resources...
      </div>
    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Firebase + Admin JS -->
  <script type="module" src="admin.js"></script>

</body>
</html>
